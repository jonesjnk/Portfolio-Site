<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>2048</title>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@700&display=swap" />
    <style>
      :root {
        --cell: 106.25px;
        --gap: 15px;
        --step: calc(var(--cell) + var(--gap));
        --dark: #776e65;
        --light: #f9f6f2;
        --radius: 6px;
        --ease-out: cubic-bezier(0.25, 1, 0.5, 1);
        --ease-pop: cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        overflow: hidden;
        background: #faf8ef;
        color: var(--dark);
        font-family: Satoshi, sans-serif;
        font-weight: 700;
        user-select: none;
        touch-action: none;
      }

      .game {
        position: relative;
        width: 500px;
        height: 500px;
        padding: var(--gap);
        box-sizing: border-box;
        border-radius: calc(var(--radius) * 2);
        background: #bbada0;
        box-shadow: 0 4px 12px rgba(119, 110, 101, 0.2);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, var(--cell));
        gap: var(--gap);
      }

      .grid div {
        height: var(--cell);
        border-radius: var(--radius);
        background: rgba(238, 228, 218, 0.35);
      }

      .tile {
        --fg: var(--light);
        --size: 55px;
        --glow: 0;
        position: absolute;
        top: var(--gap);
        left: var(--gap);
        width: var(--cell);
        height: var(--cell);
        transform: translate(calc(var(--x) * var(--step)), calc(var(--y) * var(--step)));
        transition: transform 100ms var(--ease-out);
      }

      .tile div {
        display: grid;
        place-items: center;
        height: 100%;
        border-radius: var(--radius);
        color: var(--fg);
        background: var(--bg);
        font-size: var(--size);
        box-shadow: 0 0 30px 10px rgba(243, 215, 116, var(--glow));
      }

      .tile-2 {
        --bg: #eee4da;
        --fg: var(--dark);
      }

      .tile-4 {
        --bg: #ede0c8;
        --fg: var(--dark);
      }

      .tile-8 {
        --bg: #f2b179;
      }

      .tile-16 {
        --bg: #f59563;
      }

      .tile-32 {
        --bg: #f67c5f;
      }

      .tile-64 {
        --bg: #f65e3b;
      }

      .tile-128 {
        --bg: #edcf72;
        --glow: 0.24;
        --size: 45px;
      }

      .tile-256 {
        --bg: #edcc61;
        --glow: 0.32;
        --size: 45px;
      }

      .tile-512 {
        --bg: #edc850;
        --glow: 0.4;
        --size: 45px;
      }

      .tile-1024 {
        --bg: #edc53f;
        --glow: 0.48;
        --size: 35px;
      }

      .tile-2048 {
        --bg: #edc22e;
        --glow: 0.56;
        --size: 35px;
      }

      .tile-super {
        --bg: #3c3a32;
        --size: 30px;
      }

      .new div {
        animation: appear 200ms var(--ease-out) 100ms backwards;
      }

      .merged div {
        animation: pop 200ms var(--ease-pop) 100ms backwards;
      }

      .message {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: none;
        place-content: center;
        gap: 40px;
        text-align: center;
        border-radius: inherit;
        background: rgba(238, 228, 218, 0.5);
        backdrop-filter: blur(3px);
        animation: fade-in 300ms ease 400ms both;
      }

      .message.over,
      .message.won {
        display: grid;
      }

      .message.won {
        color: var(--light);
        background: rgba(237, 194, 46, 0.5);
      }

      .message p {
        margin: 0;
        font-size: 60px;
      }

      .message button {
        height: 40px;
        padding: 0 20px;
        margin: 0 4px;
        border: 0;
        border-radius: var(--radius);
        color: var(--light);
        background: #8f7a66;
        font: inherit;
        font-size: 16px;
        cursor: pointer;
        transition:
          background-color 150ms ease,
          transform 150ms var(--ease-out);
      }

      .message button:hover {
        background: #9f8a76;
      }

      .message button:active {
        background: #7f6a56;
        transform: scale(0.96);
      }

      .keep {
        display: none;
      }

      .won .keep {
        display: inline-block;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: scale(0);
        }
      }

      @keyframes pop {
        from {
          transform: scale(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="game">
      <div class="message">
        <p></p>
        <div>
          <button class="keep">Keep going</button>
          <button class="retry">Try again</button>
        </div>
      </div>
      <div class="grid"></div>
      <div class="tiles"></div>
    </div>

    <script>
      const SIZE = 4;
      const tilesEl = document.querySelector('.tiles');
      const messageEl = document.querySelector('.message');
      const messageText = messageEl.querySelector('p');

      const VECTORS = {
        ArrowUp: [0, -1],
        ArrowRight: [1, 0],
        ArrowDown: [0, 1],
        ArrowLeft: [-1, 0],
      };
      const ALIASES = { w: 'ArrowUp', d: 'ArrowRight', s: 'ArrowDown', a: 'ArrowLeft' };

      let grid;
      let score;
      let over;
      let won;
      let keepPlaying;

      const within = ({ x, y }) => x >= 0 && x < SIZE && y >= 0 && y < SIZE;
      const tileAt = (cell) => (within(cell) ? grid[cell.x][cell.y] : null);
      const tiles = () => grid.flat().filter(Boolean);

      const emptyCells = () =>
        grid.flatMap((column, x) => column.flatMap((tile, y) => (tile ? [] : [{ x, y }])));

      const matchesAvailable = () =>
        tiles().some((tile) =>
          Object.values(VECTORS).some(
            ([dx, dy]) => tileAt({ x: tile.x + dx, y: tile.y + dy })?.value === tile.value,
          ),
        );

      function addRandomTile() {
        const cells = emptyCells();
        if (!cells.length) return;
        const { x, y } = cells[Math.floor(Math.random() * cells.length)];
        grid[x][y] = { x, y, value: Math.random() < 0.9 ? 2 : 4 };
      }

      function setup() {
        grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
        score = 0;
        over = false;
        won = false;
        keepPlaying = false;
        messageEl.className = 'message';
        addRandomTile();
        addRandomTile();
        render();
      }

      function move(key) {
        if (over || (won && !keepPlaying)) return;
        const [dx, dy] = VECTORS[key];
        const range = [...Array(SIZE).keys()];
        const xs = dx === 1 ? range.toReversed() : range;
        const ys = dy === 1 ? range.toReversed() : range;
        let moved = false;

        for (const tile of tiles()) {
          tile.mergedFrom = null;
          tile.previous = { x: tile.x, y: tile.y };
        }

        for (const x of xs) {
          for (const y of ys) {
            const tile = grid[x][y];
            if (!tile) continue;

            let farthest = { x, y };
            let next = { x: x + dx, y: y + dy };
            while (within(next) && !grid[next.x][next.y]) {
              farthest = next;
              next = { x: next.x + dx, y: next.y + dy };
            }

            const target = tileAt(next);
            grid[x][y] = null;
            if (target && target.value === tile.value && !target.mergedFrom) {
              const value = tile.value * 2;
              grid[next.x][next.y] = { ...next, value, mergedFrom: [tile, target] };
              Object.assign(tile, next);
              score += value;
              if (value === 2048) won = true;
            } else {
              grid[farthest.x][farthest.y] = tile;
              Object.assign(tile, farthest);
            }
            if (tile.x !== x || tile.y !== y) moved = true;
          }
        }

        if (!moved) return;
        addRandomTile();
        if (!emptyCells().length && !matchesAvailable()) over = true;
        render();
      }

      function place(el, { x, y }) {
        el.style.setProperty('--x', x);
        el.style.setProperty('--y', y);
      }

      function addTile(tile) {
        tile.mergedFrom?.forEach(addTile);
        const el = document.createElement('div');
        const inner = document.createElement('div');
        el.className = `tile tile-${tile.value > 2048 ? 'super' : tile.value}`;
        inner.textContent = tile.value;
        el.append(inner);
        tilesEl.append(el);

        if (tile.previous) {
          place(el, tile.previous);
          requestAnimationFrame(() => place(el, tile));
        } else {
          place(el, tile);
          el.classList.add(tile.mergedFrom ? 'merged' : 'new');
        }
      }

      function render() {
        requestAnimationFrame(() => {
          tilesEl.replaceChildren();
          tiles().forEach(addTile);
          parent.postMessage({ type: '2048-update', score }, '*');
          if (over) {
            messageEl.classList.add('over');
            messageText.textContent = 'Game over!';
          } else if (won && !keepPlaying) {
            messageEl.classList.add('won');
            messageText.textContent = 'You win!';
          }
        });
      }

      document.addEventListener('keydown', (event) => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        const key = VECTORS[event.key] ? event.key : ALIASES[event.key.toLowerCase()];
        if (key) {
          event.preventDefault();
          move(key);
        } else if (event.key.toLowerCase() === 'r') {
          setup();
        }
      });

      let touchStart = null;
      document.addEventListener(
        'touchstart',
        ({ touches }) => {
          touchStart =
            touches.length === 1 ? { x: touches[0].clientX, y: touches[0].clientY } : null;
        },
        { passive: true },
      );
      document.addEventListener('touchend', ({ touches, changedTouches }) => {
        if (!touchStart || touches.length) return;
        const dx = changedTouches[0].clientX - touchStart.x;
        const dy = changedTouches[0].clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 10) return;
        const horizontal = Math.abs(dx) > Math.abs(dy);
        move(horizontal ? (dx > 0 ? 'ArrowRight' : 'ArrowLeft') : dy > 0 ? 'ArrowDown' : 'ArrowUp');
      });

      document.querySelector('.retry').addEventListener('click', setup);
      document.querySelector('.keep').addEventListener('click', () => {
        keepPlaying = true;
        messageEl.className = 'message';
      });

      document
        .querySelector('.grid')
        .append(...Array.from({ length: SIZE * SIZE }, () => document.createElement('div')));
      setup();
    </script>
  </body>
</html>
